[alembic]
script_location = alembic
prepend_sys_path = .

# The actual database URL is loaded from app.core.config.Settings.
# Do not put Supabase credentials directly in this file.
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
stream = ext://sys.stderr


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s